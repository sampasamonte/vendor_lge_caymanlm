# The configuration file, that is used by HDCP Toolkit
# /vendor/etc/ISHdcp2.cfg
# hdcp version : 5.3.6_RC66

# The SFS folder, where HDCP secrets shall be provisioned/loaded
SecretsFolder=/mnt/vendor/persist-lg/data

# The path and name (without the extension) of the trusted application, to be used
# by HDCP Toolkit
TaFullPathName=/system/etc/firmware/is_hdcp2

# Debugging log level to be printed (both by NWd and SWd components)
# 0 - no log output
# 1 - errors
# 2 - warnings
# 3 - information
# 4 - debug
# 5 - trace
LogLevel=4

# Connection retry timeout for locality check. It shall not be lower than 7 ms defined by the
# HDCP specification
ConnectionRetryTimeoutMs=14
# Locality check retry count. It shall not be higher than 1023 as defined by HDCP specification
LocalityCheckRetryCount=1023

#This value defines how many times the TCP connection shall be attempted
TcpConnectionRetryCount=30
#This value defines TCP connection retry interval
connectionRetrySocketTimeoutMs=50
#Sets read and write sockets timeouts with setsockopt() command, parameters SO_RCVTIMEO and SO_SNDTIMEO
readWriteSocketTimeoutMs=5000
